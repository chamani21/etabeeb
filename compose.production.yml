# eTabeeb – Production Docker Compose
# Deploy command: docker compose -f compose.production.yml up -d
# NEVER store real secrets here. All secrets come from .env.production (host-only file).
#
# Assumptions (blue/green-friendly):
#   - PostgreSQL and Redis are already running on the host network (managed separately)
#   - Reverse proxy (nginx / Caddy) terminates TLS and forwards to this container
#   - This compose file ONLY manages the eTabeeb Next.js app container

version: "3.9"

services:
  # ── eTabeeb Next.js Web + API ──────────────────────────────────────────────
  etabeeb-web:
    image: etabeeb-web:${IMAGE_TAG:-latest}
    container_name: etabeeb-web
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped

    environment:
      # All values are injected from the host .env.production file.
      # See .env.production.example for the full list.
      NODE_ENV: production
      PORT: "3000"

      # App
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_BASE_PATH: /etabeeb
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # Database
      DATABASE_URL: ${DATABASE_URL}

      # LiveKit video (optional – set LIVEKIT_API_KEY to enable)
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}

      # WhatsApp Cloud API
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}

      # Email (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@etabeeb.online}

      # File storage
      UPLOAD_DIR: /app/private-uploads

    ports:
      # Bind only to localhost – reverse proxy forwards here
      - "127.0.0.1:3000:3000"

    volumes:
      # Uploaded medical documents – persisted outside the container
      - etabeeb-uploads:/app/private-uploads

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/etabeeb/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - etabeeb-net

  # ── Database migration runner (one-shot, exits when done) ──────────────────
  etabeeb-migrate:
    image: etabeeb-web:${IMAGE_TAG:-latest}
    container_name: etabeeb-migrate
    restart: "no"

    environment:
      DATABASE_URL: ${DATABASE_URL}

    # Override the CMD to run migrations then exit
    entrypoint: ["node", "-e",
      "require('child_process').execFileSync('npx', ['drizzle-kit', 'migrate', '--config', 'db/drizzle.config.js'], { stdio: 'inherit' })"]

    networks:
      - etabeeb-net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  etabeeb-uploads:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  etabeeb-net:
    driver: bridge
    # Attach this to the host's existing Docker network if needed:
    # external: true
    # name: webnet
