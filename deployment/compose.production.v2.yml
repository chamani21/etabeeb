# Public eTabeeb website container on the existing Kozhak internal network.
# Secrets remain in the VPS-only runtime.env file.
services:
  kozhak-etabeeb-next:
    image: etabeeb-web:${IMAGE_TAG:?set IMAGE_TAG to the verified website image tag}
    container_name: kozhak-etabeeb-next
    restart: unless-stopped
    expose:
      - "3000"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    env_file:
      - /opt/kozhak/etabeeb/shared/runtime.env
    volumes:
      - etabeeb_uploads:/app/private-uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/etabeeb/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kozhak_internal
    security_opt:
      - no-new-privileges:true

volumes:
  etabeeb_uploads:
    name: etabeeb_uploads

networks:
  kozhak_internal:
    external: true
